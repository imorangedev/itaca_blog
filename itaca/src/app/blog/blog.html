<div class="container-blog">

  <h1 class="blog-title">Blog</h1>
  <p class="blog-subtitle">Thoughts on software, data, and everything in between.</p>

  <div class="posts-grid">
    @for (post of posts(); track post.post_id) {
      <a class="post-card" [href]="post.url" target="_blank" rel="noopener noreferrer">
        <h2 class="post-title">{{ post.title }}</h2>
        <p class="post-content">{{ post.content }}</p>
        <span class="post-link-hint">Read more →</span>
      </a>
    }
  </div>

</div>
